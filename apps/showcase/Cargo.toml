[package]
name = "icss-showcase"
description = "Live gallery and interactive theme editor for the icss design system."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "icss-showcase"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[dependencies]
icss = { workspace = true }
iced = { workspace = true }
iced_fonts = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
tokio = { workspace = true }

[lints]
workspace = true
